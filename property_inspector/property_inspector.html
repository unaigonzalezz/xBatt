<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xBatt Property Inspector</title>
    <link rel="stylesheet" href="css/sdpi.css">
    <link rel="stylesheet" href="css/property-inspector.css">
    <style>
        .sdpi-wrapper {
            padding: 20px;
        }

        .sdpi-item {
            margin-bottom: 20px;
        }

        .sdpi-item-label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .sdpi-item-value {
            width: 100%;
            padding: 5px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .action-item {
            display: flex;
            align-items: center;
            gap: 20px;
        }

            .action-item img {
                width: 45px;
                height: 45px;
            }

            .action-item .description {
                font-size: 13px;
                line-height: 1.5;
            }

        .error-message {
            color: red;
            display: none;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-item" id="counter_value">
            <div class="sdpi-item-label">Controller number (1-4)</div>
            <input id="controllerValue" class="sdpi-item-value" type="number" min="1" max="4" placeholder="Enter controller number" onchange="setSettings(event.target.value, 'ControllerNumber')" />
        </div>
        <div id="error-message" class="error-message">
            Please select a valid controller number (1-4).
        </div>
        <br />
        <div class="actions" style="display:flex; flex-direction:column; align-items:flex-start; gap:8px;">
            <a href='https://ko-fi.com/X8X4LBFTT' target='_blank'>
                <img height='36' style='border:0px;height:36px;' src='https://storage.ko-fi.com/cdn/kofi1.png?v=6' border='0' alt='Buy Me a Coffee at ko-fi.com' />
            </a>
            <p style="margin:0; font-size:14px; line-height:1.4;">
                If you enjoy my work and want to support me to keep creating useful tools, buy me a coffee! ☕
                Your support helps me improve my projects and keep them running.
            </p>
        </div>
    </div>
    <script src="js/property-inspector.js"></script>
</body>
</html>
